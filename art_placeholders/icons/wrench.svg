             L 10 46 
             C 7 49, 7 55, 11 58 
             C 14 62, 20 62, 23 59 
             L 36 46 
             C 41 49, 48 48, 51 43 
             L 47 39 
             C 46 38, 46 36, 47 35 
             L 50 32 
             C 51 31, 53 31, 54 32 
             L 58 36 
             C 63 33, 64 26, 61 21 
             C 59 18, 57 14, 53 11 
             Z" 
          fill="#f59e0b" 
          stroke="#1f2937" 
          stroke-width="3" 
